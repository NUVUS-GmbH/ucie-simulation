# Overhead comparison only: CRC and retry disabled under the same buffer sizes.
# Not a recommendation to disable protection.

clock_period_ns: 1.0
cycle_mode: false
trace: transactions
sim_timeout_ns: 200000000

reference:
  link_width: 16
  fdi_width_bits: 512
  flit_format: 6
  crc_enabled: false
  retry_enabled: false
  l1_enabled: true
  error_logging: true
  ucie_revision: ucie2x
  priority_sideband: false

axi:
  handshake_cycles: 1
  arbitration_cycles: 1
  request_queue: 8
  response_queue: 8

aou:
  pack_cycles: 2
  credit_depth: 32
  request_queue: 8
  partition_credits: false

ucie:
  tx_buffer_entries: 32
  rx_buffer_entries: 64
  retry_buffer_entries: 16
  early_credit_return: true
  credit_update_threshold: 2
  single_inflight_slot: false
  serialization_cycles: 4
  propagation_cycles: 2
  buffer_cycles: 1
  retrain_ns: 5000
  link_reset_ns: 10000
  reactivation_ns: 2000

spec:
  replay_timeout_flits: 375
  link_error_residency_ns: 16000000
  sideband_timeout_ns: 8000000

policy:
  recovery: discard
  replay_limit: 3
  retrain_preserves_retry: true

target:
  accept_cycles: 2
  commit_cycles: 4
  response_cycles: 2
  completion_cycles: 1

sideband:
  fifo_entries: 8
  message_ns: 50
  priority_ns: 20

virt:
  guest_queue: 8
